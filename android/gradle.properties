# ============================
# Gradle Performance Settings
# ============================
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Gradle JVM Memory (M1 – 8GB RAM)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC
org.gradle.java.home=/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home
# ============================
# Kotlin Optimization
# ============================
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xms2048m -Xmx4096m

# ============================
# AndroidX & R Class Perf
# ============================
android.useAndroidX=true
android.nonTransitiveRClass=true

# ============================
# React Native – NEW ARCH
# ============================
newArchEnabled=true
hermesEnabled=true

# ============================
# ABI Filters (only arm64-v8a)
# MASSIVE build speed improvement
# ============================
reactNativeArchitectures=arm64-v8a,armeabi-v7a

# ============================
# UI flags
# ============================
edgeToEdgeEnabled=false

# ============================
# Enable 16KB memory page compatibility (Android 15+)
# ============================
android.experimental.enable16kPages=true
